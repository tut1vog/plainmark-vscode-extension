name: CI

# Day-one matrix is Linux × Desktop+Web, latest stable VS Code only.
# macOS / Windows / VS Code version matrix are reactive adds, not day-one
# investment.
#
# The static job and both integration jobs build with `pnpm run build` — the
# production bundle (minified, console.* pure-stripped, no sourcemaps) that
# release.yml packages — so what ships is compiled and loaded in a real
# extension host before publish. The visual job keeps `build:dev`: its tests
# import src/ through vite and only need dist/ for the lazy MathJax bundle.
#
# pnpm/Node versions are pinned once, in .github/actions/setup/action.yml.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Newer pushes to the same branch cancel in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Lint + type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm run build:check
      - run: pnpm run spec:check
      - run: pnpm run deadcode

  unit-and-source:
    name: Unit + source-preservation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run test:unit
      - run: pnpm run test:source-preservation

  fuzz:
    name: Fuzz suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Blocking — promoted from soft-fail. The
    # initial run is clean (no new regressions; allowlisted upstream
    # divergences are pinned in fixtures/metamorphic-known-divergences.json).
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run test:fuzz

  visual:
    name: Visual + browser fuzz (Playwright Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build:dev
      - run: pnpm run test:visual

  integration-desktop:
    name: Integration — VS Code Desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run build
      - run: pnpm run test:integration:desktop:build
      # VS Code Desktop is an Electron app — Linux needs a virtual display.
      - run: xvfb-run -a node tests/integration/electron/run-tests.mjs

  integration-web:
    name: Integration — VS Code Web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run build
      - run: pnpm run test:integration:web:build
      - run: node tests/integration/web/run-tests.mjs
