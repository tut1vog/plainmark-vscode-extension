name: Release

# Publishes to the VS Code Marketplace and cuts a GitHub release (tag +
# .vsix asset) after CI succeeds on a main-branch push whose package.json
# version has no v<version> tag yet. Ordinary pushes no-op at the gate;
# a release is triggered by the version-bump commit (see
# .claude/commands/release.md in the workspace).
#
# Re-running a failed run is safe: publish is skipped when the Marketplace
# already lists the version, and the release step attaches the .vsix to an
# existing release instead of failing on it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Never cancel a release in flight — a cancelled publish can leave the
# Marketplace updated but the tag/release missing.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Publish + tag + GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check whether this version is already released
        id: gate
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already tagged — nothing to release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        if: steps.gate.outputs.new == 'true'
        run: |
          awk -v ver="${{ steps.gate.outputs.version }}" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${{ steps.gate.outputs.version }} — refusing to release without notes." >&2
            exit 1
          fi

      - uses: ./.github/actions/setup
        if: steps.gate.outputs.new == 'true'

      # vsce is a lockfile-pinned devDependency run through pnpm — never
      # `npx @vscode/vsce`, which would fetch whatever `latest` is at release
      # time and run it next to VSCE_PAT.
      - name: Build and package
        if: steps.gate.outputs.new == 'true'
        run: |
          pnpm run build
          pnpm run package

      # The Marketplace rejects a version it already has, so a re-run after a
      # failed tag/release step must not publish again. `vsce show` reads the
      # public gallery — this step never sees VSCE_PAT.
      - name: Check whether the Marketplace already has this version
        id: marketplace
        if: steps.gate.outputs.new == 'true'
        run: |
          if pnpm exec vsce show tutivog.plainmark --json | node -e '
            const ext = JSON.parse(require("fs").readFileSync(0, "utf8"));
            process.exit(ext.versions.some((v) => v.version === process.argv[1]) ? 0 : 1);
          ' "${{ steps.gate.outputs.version }}"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.gate.outputs.version }} is already on the Marketplace — skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the VS Code Marketplace
        if: steps.gate.outputs.new == 'true' && steps.marketplace.outputs.published == 'false'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: >-
          pnpm exec vsce publish --no-dependencies
          --packagePath "plainmark-${{ steps.gate.outputs.version }}.vsix"

      - name: Create tag and GitHub release
        if: steps.gate.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.gate.outputs.version }}"
          VSIX="plainmark-${{ steps.gate.outputs.version }}.vsix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already has a release — refreshing its .vsix asset."
            gh release upload "$TAG" "$VSIX" --clobber
          else
            gh release create "$TAG" "$VSIX" \
              --title "$TAG" \
              --notes-file release-notes.md \
              --target "${{ github.event.workflow_run.head_sha }}"
          fi
